[project]
name = "firefly-koinon-sdk"
version = "26.11.3"
description = "Typed asynchronous Python client for firefly koinon"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Firefly Software Foundation" }]
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
dependencies = ["httpx>=0.28,<1", "pydantic>=2.10,<3"]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "pyright>=1.1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/koinon_sdk"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
target-version = "py312"
line-length = 110
[tool.ruff.lint]
select = ["E","F","I","UP","B","SIM"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src"]
extraPaths = ["src"]
