name: Integrations

on:
  push:
    branches: [main]
    paths: ["integrations/**", ".claude-plugin/**", "brand/**", "LICENSE", "NOTICE", ".github/workflows/integrations.yml"]
  pull_request:
    paths: ["integrations/**", ".claude-plugin/**", "brand/**", "LICENSE", "NOTICE", ".github/workflows/integrations.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: integrations/mcp-desktop/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Build and qualify the desktop extension and skills
        working-directory: integrations/mcp-desktop
        run: |
          npm ci --ignore-scripts
          npm run package
      - name: Check packaged checksums
        working-directory: integrations/mcp-desktop/dist
        run: sha256sum --check SHA256SUMS

  plugins:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Validate offline plugin profiles and canonical catalog
        run: |
          python -m pip install "pydantic>=2.14.1,<3" "jsonschema==4.26.0" "pytest>=8,<9" "ruff>=0.8" "pyright>=1.1"
          python integrations/plugins/plugin_build.py --check-catalog
          python -m pytest integrations/plugins/tests -q
          python -m ruff check integrations/plugins
          python -m ruff format --check integrations/plugins
          python -m pyright --pythonpath "$(command -v python)" integrations/plugins/*.py
