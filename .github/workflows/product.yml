name: Product

on:
  push:
    branches: [main]
    paths: ["backend/**", "packages/**", "frontend/**", "sdk/typescript/**", "brand/**", "deploy/**", ".github/workflows/product.yml"]
  pull_request:
    paths: ["backend/**", "packages/**", "frontend/**", "sdk/typescript/**", "brand/**", "deploy/**", ".github/workflows/product.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-${{ github.ref }}
  cancel-in-progress: true

jobs:
  management-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KOINON_REQUIRE_NGINX: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install the native proxy and test runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx
          python -m pip install "pytest>=8"
      - name: Exercise management links, assets and backend routing
        run: python -m pytest deploy/tests/test_management_routing.py -q

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src:../packages/canon/src:../packages/structured/src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install locked backend and development tools
        run: |
          python -m pip install uv==0.11.19
          uv sync --project backend --locked --extra dev --extra storage-azure --extra storage-gcs
      - name: Lint and type check the application
        working-directory: backend
        run: |
          .venv/bin/ruff check src tests
          .venv/bin/pyright --pythonpath .venv/bin/python src/koinon
      - name: Test application and deployment configuration
        working-directory: backend
        run: |
          .venv/bin/python -m pytest -q
          .venv/bin/python -m pytest -q ../deploy/tests
      - name: Exercise real cloud SDK transports with the governed native executor
        working-directory: backend
        run: .venv/bin/python -m pytest -q -c ../packages/storage/pyproject.toml ../packages/storage/tests

  native-installation-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "127.0.0.1:5439:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PYTHONPATH: src:../packages/canon/src:../packages/structured/src
      KOINON_INSTALLATION_ANN_TEST_PG_URL: postgresql://postgres@127.0.0.1:5439/postgres
      KOINON_ANSWER_RELEASE_TEST_PG_URL: postgresql://postgres@127.0.0.1:5439/postgres
      KOINON_TEST_BULK_POSTGRES_URL: postgresql://postgres@127.0.0.1:5439/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install the locked native installation test environment
        run: |
          python -m pip install uv==0.11.19
          uv sync --project backend --locked --extra dev
      - name: Verify real indexes, recovery and scope fences
        working-directory: backend
        run: .venv/bin/python -m pytest -q tests/installation/test_installation_native_postgres.py tests/answers/test_release_postgres.py tests/knowledge/bulk/test_bulk_pinned_postgres.py ../deploy/tests/test_operator_contacts.py ../deploy/tests/test_operator_cli_postgres.py

  native-units:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: canon
            extras: dev
            suites: tests/unit tests/native
          - package: structured
            extras: dev --extra file-readers
            suites: tests/unit
          - package: storage
            extras: dev --extra azure --extra gcs
            suites: tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install the domain's locked development dependencies
        run: |
          python -m pip install uv==0.11.19
          uv sync --project packages/${{ matrix.package }} --locked --extra ${{ matrix.extras }}
      - name: Test native domain behavior
        working-directory: packages/${{ matrix.package }}
        run: .venv/bin/python -m pytest -q ${{ matrix.suites }}
      - name: Check and build the independent storage package
        if: matrix.package == 'storage'
        working-directory: packages/storage
        run: |
          .venv/bin/ruff check src tests
          .venv/bin/pyright --pythonpath .venv/bin/python src
          uv build

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            sdk/typescript/package-lock.json
            frontend/package-lock.json
      - name: Build the framework-neutral SDK
        working-directory: sdk/typescript
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Install frontend tools and Chromium
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Lint, test and build all frontend entry points
        working-directory: frontend
        run: |
          npm run lint
          npm run build
          npm test
          npx ng build catalog
          node scripts/smoke-consumer.mjs
          npm run check:bundle
      - name: Test browser journeys
        working-directory: frontend
        run: npx playwright test
