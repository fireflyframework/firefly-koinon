name: Performance probe correctness

on:
  pull_request:
    paths: ["tools/performance/**", "packages/canon/src/flycanon/core/services/query/rlm/**", "packages/canon/src/flycanon/models/repositories/source_repository.py", ".github/workflows/performance-probes.yml"]
  push:
    branches: [main]
    paths: ["tools/performance/**", "packages/canon/src/flycanon/core/services/query/rlm/**", "packages/canon/src/flycanon/models/repositories/source_repository.py", ".github/workflows/performance-probes.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: tools/performance:packages/canon/src:packages/structured/src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install locked native development dependencies
        run: |
          python -m pip install uv==0.11.19
          uv sync --project packages/canon --locked --extra dev
      - name: Verify scope, complete batches and measurement boundaries
        run: |
          packages/canon/.venv/bin/python -m unittest discover -s tools/performance/tests -v
          packages/canon/.venv/bin/ruff check --config packages/canon/pyproject.toml tools/performance
          packages/canon/.venv/bin/pyright -p tools/performance --pythonpath packages/canon/.venv/bin/python
