site_name: firefly koinon
site_description: Your corporate brain. Documents, data and reviewed knowledge, connected to their sources.
site_url: https://fireflyframework.github.io/firefly-koinon/
repo_url: https://github.com/fireflyframework/firefly-koinon
repo_name: fireflyframework/firefly-koinon
copyright: Copyright 2026 Firefly Software Foundation
strict: true
exclude_docs: |
  /superpowers/
theme:
  name: material
  custom_dir: docs_theme
  logo: assets/firefly-koinon-lockup.svg
  favicon: assets/koinon-symbol.svg
  font: false
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Use dark appearance}
    - scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Use light appearance}
extra_css: [assets/styles.css]
extra_javascript: [assets/reader.js]
extra: {generator: false}
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.highlight:
      linenums: true
      linenums_style: pymdownx-inline
      anchor_linenums: false
      line_spans: __span
      pygments_lang_class: true
      auto_title: true
      auto_title_map:
        Bash: Shell
        Text only: Text
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
