[project]
name = "firefly-koinon-storage"
version = "26.10.1"
description = "Bounded immutable private cloud object storage for firefly koinon."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
authors = [{ name = "Firefly Software Foundation" }]
dependencies = []

[project.optional-dependencies]
azure = ["azure-storage-blob>=12.23,<13", "azure-identity>=1.19,<2"]
gcs = ["google-cloud-storage>=3,<4"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "pyright>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/koinon_storage"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 110
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
include = ["src"]
