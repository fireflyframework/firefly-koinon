# Include inside an operator-managed TLS server instead of nginx.conf to serve Angular here.
# Set this root to the read-only output of the management build.
root /opt/koinon/current/frontend/dist/management/browser;
index index.html;
default_type application/octet-stream;
types {
    text/html html;
    text/css css;
    text/javascript js mjs;
    application/json json;
    image/svg+xml svg;
    image/png png;
    image/jpeg jpg jpeg;
    image/webp webp;
    image/avif avif;
    image/gif gif;
    image/x-icon ico;
    font/woff2 woff2;
}
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy same-origin always;

location ~ ^/(?:api|bff|oauth2|login|logout|auth|mcp|\.well-known)(?:/|$) {
    proxy_pass http://127.0.0.1:18781;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    client_max_body_size 129m;
}

location ~ ^/(?:health|ready)$ {
    proxy_pass http://127.0.0.1:18781;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /index.html {
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    try_files /index.html =404;
}

location /assets/ {
    try_files $uri =404;
}

location ~* \.(?:js|mjs|css|map|json|svg|png|jpe?g|webp|avif|gif|ico|woff2?)$ {
    try_files $uri =404;
}

location / {
    try_files $uri $uri/ /index.html;
}
