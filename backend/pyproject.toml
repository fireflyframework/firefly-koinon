[project]
name = "firefly-koinon"
version = "26.10.2"
description = "Tenant-scoped structured and unstructured knowledge management on native pyfly."
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
authors = [{ name = "Firefly Software Foundation" }]
dependencies = [
    "firefly-koinon-storage==26.10.2",
  "firefly-koinon-documents==26.10.2",
  "firefly-koinon-structured[file-readers]==26.10.2",
  "pyfly[cache,fastapi,security,data-relational,postgresql,agentic,agentic-script-execution,templates,observability,client,mcp]>=26.10.31,<26.11",
  "asyncpg>=0.30",
  "aiosqlite>=0.22",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "sqlglot>=26",
  "duckdb>=1.3.2",
  "pyarrow>=17",
  "psutil>=6,<9",
  "python-multipart>=0.0.20",
  "Pillow>=13,<14",
  "mcp>=2.3,<3",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
notifications-azure = ["pyfly[notifications-azure]>=26.10.31,<26.11"]
storage-azure = ["firefly-koinon-storage[azure]==26.10.2"]
storage-gcs = ["firefly-koinon-storage[gcs]==26.10.2"]
storage-s3 = ["boto3>=1.43.116,<2"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-timeout>=2.3", "httpx>=0.28", "ruff>=0.8", "pyright>=1.1", "asgi-lifespan>=2.1"]

[tool.uv.sources]
firefly-koinon-storage = { path = "../packages/storage", editable = true }
firefly-koinon-documents = { path = "../packages/canon", editable = true }
firefly-koinon-structured = { path = "../packages/structured", editable = true }
pyfly = { git = "https://github.com/fireflyframework/fireflyframework-pyfly.git", rev = "bd0eb79f66fc2d9b839acb594048a07d2f92354a" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/koinon"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--tb=short"
markers = ["integration: owned local infrastructure", "live: requires an explicitly configured model provider"]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
include = ["src/koinon"]
